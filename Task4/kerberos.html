<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Q3 Simplified Kerberos AES-128-CBC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f7f7;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 950px;
            margin: auto;
            box-shadow: 0 0 10px #ccc;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-family: monospace;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
        }

        pre {
            background: #111;
            color: #0f0;
            padding: 20px;
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 20px;
            border-radius: 8px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
<div class="container">

    <h1> AWS Kerberos Authentication</h1>
    <h2>AES-128-CBC</h2>

    <label>Client Key KC = MD5(C, Student ID)</label>
    <input id="kc" value="26c6867eb2e659318202045650cd2132">

    <label>Server Key KS = MD5(S, Student ID)</label>
    <input id="ks" value="9371f1adf9c69490934f86977fc9a916">

    <label>Session Key sk</label>
    <input id="sk" value="fec313f129959c5d4eaed6c75f4a9c2a">

    <label>IV</label>
    <input id="iv" value="00000000000000000000000000000000">

    <label>Client Name C</label>
    <input id="client" value="Souharda">

    <label>Server Name S</label>
    <input id="server" value="Shraban">

    <label>Lifetime Lt</label>
    <input id="lt" value="8 hours">

    <label>Nonce nC = MD5(C)</label>
    <input id="nonce" value="aeee3683f994e22130d378341c7a687c">

    <label>Timestamp ts</label>
    <input id="timestamp" value="2026-05-02T10:00:00">

    <button onclick="runKerberos()">Run Kerberos Simulation</button>

    <pre id="output">Output will appear here...</pre>

</div>

<script src="kerberos.js"></script>
</body>
</html>
