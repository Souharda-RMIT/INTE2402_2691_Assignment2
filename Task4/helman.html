<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Q4 Diffie-Hellman Key Establishment</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    h1, h2 {
      color: #222;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-family: monospace;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    pre {
      background: #111;
      color: #00ff7f;
      padding: 20px;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 8px;
      overflow-x: auto;
    }

    .note {
      background: #eef4ff;
      padding: 12px;
      border-left: 5px solid #2b6cb0;
      margin-top: 15px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Q4: AWS Site-to-Site VPN Diffie-Hellman Key Establishment</h1>

    

    <label for="firstName">VPC name / First name:</label>
    <input type="text" id="firstName" value="Souharda">

    <label for="surname">Data centre name / Surname:</label>
    <input type="text" id="surname" value="Shraban">

    <label for="studentId">Student ID:</label>
    <input type="text" id="studentId" value="s4118798">

    <button id="computeBtn">Generate Random Values and Compute </button>

    <h2>Computation Output</h2>
    <pre id="output"></pre>
  </div>

  <script src="diffiehelman.js"></script>
</body>
</html>
